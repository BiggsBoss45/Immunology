<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>V-03 (Viral Sequence)</title>

<style>
body{
    margin:0;
    background:black;
    color:white;
    font-family:Courier New, monospace;
    padding:40px;
}

/* HEADER */
h1{
    text-align:center;
    letter-spacing:4px;
    margin-bottom:30px;
}

/* SEQUENCE BLOCKS */
.block{
    margin-bottom:40px;
    line-height:2.2;
}

/* CODONS */
.codon{
    display:inline-block;
    margin:4px;
    padding:2px 6px;
    border:1px solid rgba(255,255,255,0.2);
}

/* VECTOR (hidden target gene styling hook for later puzzles) */
.vector{
    border-color:rgba(255,255,255,0.6);
    transition:0.2s;
}

.vector:hover{
    background:white;
    color:black;
}
</style>

</head>

<h1>V-03 (Viral Sequence)</h1>
