<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immunology System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- AUDIO -->
    <audio id="bootAudio" src="BootupIm.mp3"></audio>

    <!-- SCREEN 1 -->
    <div id="startScreen" class="screen active">
        <h1>PRESS ENTER / TAP SCREEN</h1>
    </div>

    <!-- SCREEN 2 -->
    <div id="bootScreen" class="screen">

    <div id="vectorContainer">

        <div class="scanCircle"></div>
        <div class="scanLine horizontal"></div>
        <div class="scanLine vertical"></div>

        <img src="Immune.png" id="immuneLogo">

    </div>

</div>

    <!-- SCREEN 3 -->
    <div id="continueScreen" class="screen">

    <div id="continuePrompt">

        PRESS ENTER / TAP TO CONTINUE

    </div>

</div>

    <!-- MAIN MENU -->
   <div id="menuScreen" class="screen">

    <div class="menuGrid">

        <!-- VIDEO LOGS -->

        <div class="menuPanel"
        onclick="openTab('audioTab')">

            <img src="preview1.png"
            class="panelImage">

            <div class="panelOverlay">

                <h1>VIDEO LOGS</h1>

            </div>

        </div>

        <!-- AMINO ACID -->

        <div class="menuPanel"
        onclick="openTab('docTab')">

            <img src="preview2.png"
            class="panelImage">

            <div class="panelOverlay">

                <h1>AMINO ACID SEQUENCE</h1>

            </div>

        </div>

        <!-- PHASE 2 -->

        <div class="menuPanel"
        onclick="openTab('phase2Tab')">

            <img src="preview3.png"
            class="panelImage">

            <div class="panelOverlay">

                <h1>PHASE 2</h1>

            </div>

        </div>

    </div>

    <!-- AUDIO TAB -->

    <div id="audioTab" class="tabContent">

        <button id="revealButton"
        onclick="revealVideo()">

            OPEN AUDIO LOG

        </button>

        <div id="videoContainer"
        style="display:none; margin-top:30px;">

            <video controls width="900">

                <source src="video1.mp4"
                type="video/mp4">

            </video>

        </div>

        <button class="backButton"
        onclick="closeTabs()">

            BACK

        </button>

    </div>

    <!-- DOC TAB -->

    <div id="docTab" class="tabContent">

        <iframe src="Doc1.html"></iframe>

        <button class="backButton"
        onclick="closeTabs()">

            BACK

        </button>

    </div>

    <!-- PHASE 2 TAB -->

    <div id="phase2Tab" class="tabContent">

        <h2>
            Please Enter All Possible Vectors
        </h2>

        <div class="passwordBoxes">

            <input type="text" id="box1">
            <input type="text" id="box2">
            <input type="text" id="box3">
            <input type="text" id="box4">

        </div>

        <button onclick="checkPassword()">
            ENTER
        </button>

        <p id="passwordResult"></p>

        <button class="backButton"
        onclick="closeTabs()">

            BACK

        </button>

    </div>

</div>

    <!-- AUDIO LOG -->
    <div id="audioTab" class="tabContent">

        <button id="revealButton" onclick="revealVideo()">
            OPEN AUDIO LOG
        </button>

        <div id="videoContainer" style="display:none; margin-top:20px;">

            <video controls width="700">
                <source src="video1.mp4" type="video/mp4">
            </video>

        </div>

    </div>

    <!-- DOCUMENT -->
    <div id="docTab" class="tabContent">

        <iframe src="Doc1.html"></iframe>

    </div>

    <!-- PHASE 2 -->
    <div id="phase2Tab" class="tabContent">

        <h2>Please Enter All Possible Vectors</h2>

        <div class="passwordBoxes">

            <input type="text" id="box1">

            <input type="text" id="box2">

            <input type="text" id="box3">

            <input type="text" id="box4">

        </div>

        <button onclick="checkPassword()">ENTER</button>

        <p id="passwordResult"></p>

    </div>

</div>

        <!-- AUDIO LOG -->
        <div id="audioTab" class="tabContent activeTab">
            <video controls width="700">
                <source src="video1.mp4" type="video/mp4">
            </video>
        </div>

        <!-- DOCUMENT -->
        <div id="docTab" class="tabContent">
            <iframe src="Doc1.html"></iframe>
        </div>

        <!-- PHASE 2 -->
        <div id="phase2Tab" class="tabContent">
            <h2>Please Enter All Possible Vectors</h2>

            <div class="passwordBoxes">
                <input type="text" id="box1" placeholder="V-03">
                <input type="text" id="box2" placeholder="E-13">
                <input type="text" id="box3" placeholder="H-07">
                <input type="text" id="box4" placeholder="P-09">
            </div>

            <button onclick="checkPassword()">ENTER</button>

            <p id="passwordResult"></p>
        </div>

    </div>

<script src="script.js"></script>
</body>
</html>
